    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Daily Equation",
        "url": "https://daily-equation.correia95.workers.dev/",
        "applicationCategory": "GameApplication",
        "genre": "Puzzle",
        "gamePlatform": "Web browser",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" },
        "description": "A daily maths word-game: guess the hidden arithmetic equation in six tries."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you play Daily Equation?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There is one hidden calculation of eight tiles, made from the digits 0 to 9 and the symbols plus, minus, times, divide and equals. You have six guesses. Every guess must itself be a true calculation, for example 12+34=46. After each guess the tiles turn green (right symbol, right place), purple (in the equation but elsewhere) or dark (not in the equation)."
            }
          },
          {
            "@type": "Question",
            "name": "Is it the same puzzle for everyone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The equation is generated from the calendar date, so everyone gets the same puzzle each day and results are comparable. A new one appears at midnight."
            }
          },
          {
            "@type": "Question",
            "name": "What are the maths rules?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Standard order of operations: multiplication and division are resolved before addition and subtraction. Division is always exact, there are no negative numbers, and the value to the right of the equals sign is just the answer."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work on a phone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It is a mobile-first browser game with an on-screen keypad, no app to install and no account. Your streak is stored only on your device."
            }
          }
        ]
      }
    </script>
