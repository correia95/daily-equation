    <g font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="86" text-anchor="middle">
      <rect x="0"   y="0" width="120" height="120" rx="12" fill="#2e9e5b" /><text x="60"  y="86" fill="#fff">1</text>
      <rect x="136" y="0" width="120" height="120" rx="12" fill="#2e9e5b" /><text x="196" y="86" fill="#fff">2</text>
